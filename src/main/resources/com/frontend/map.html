<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Route preview</title>
    <style>
        html, body { height: 100%; margin: 0; font: 14px sans-serif; color: #183047; }
        body { background: #f3f7f8; }
        main { box-sizing: border-box; display: flex; flex-direction: column; height: 100%; padding: 12px; }
        p { margin: 0 0 8px; color: #526678; }
        svg { width: 100%; height: 100%; min-height: 300px; background: #e6f0ec; border: 1px solid #c5d4d1; border-radius: 8px; }
        .grid { stroke: #d0dfda; stroke-width: 1; }
        .route { fill: none; stroke: #1266b1; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .marker { fill: #d94b3d; stroke: white; stroke-width: 3; }
        .label { font: 14px sans-serif; fill: #183047; paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }
        #empty { fill: #526678; font: 16px sans-serif; text-anchor: middle; }
    </style>
</head>
<body>
<main>
    <p>Route preview from the returned coordinates (not a street map).</p>
    <svg id="map" viewBox="0 0 900 600" role="img" aria-label="Route preview">
        <g id="grid"></g>
        <text id="empty" x="450" y="300">Waiting for route data...</text>
        <path id="route" class="route"></path>
        <g id="markers"></g>
    </svg>
</main>
<script>
    const svgNamespace = "http://www.w3.org/2000/svg";
    const routeElement = document.getElementById("route");
    const markersElement = document.getElementById("markers");
    const emptyElement = document.getElementById("empty");
    let locations = [];
    let routePoints = [];

    function project(latitude, longitude, bounds) {
        const longitudeRange = bounds.maxLongitude - bounds.minLongitude || 0.01;
        const latitudeRange = bounds.maxLatitude - bounds.minLatitude || 0.01;
        return {
            x: 70 + (longitude - bounds.minLongitude) / longitudeRange * 760,
            y: 70 + (bounds.maxLatitude - latitude) / latitudeRange * 460
        };
    }

    function render() {
        const points = routePoints.length
            ? routePoints
            : locations.map(location => [location.latitude, location.longitude]);
        if (!points.length) {
            emptyElement.style.display = "";
            routeElement.setAttribute("d", "");
            markersElement.replaceChildren();
            return;
        }

        emptyElement.style.display = "none";
        const bounds = {
            minLatitude: Math.min(...points.map(point => point[0])),
            maxLatitude: Math.max(...points.map(point => point[0])),
            minLongitude: Math.min(...points.map(point => point[1])),
            maxLongitude: Math.max(...points.map(point => point[1]))
        };
        const projected = points.map(point => project(point[0], point[1], bounds));

        if (routePoints.length > 1) {
            routeElement.setAttribute("d", projected.map((point, index) =>
                `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
            ).join(" "));
        } else {
            routeElement.setAttribute("d", "");
        }

        markersElement.replaceChildren();
        locations.forEach(location => {
            const point = project(location.latitude, location.longitude, bounds);
            const marker = document.createElementNS(svgNamespace, "circle");
            marker.setAttribute("cx", point.x);
            marker.setAttribute("cy", point.y);
            marker.setAttribute("r", 9);
            marker.setAttribute("class", "marker");
            markersElement.appendChild(marker);

            const label = document.createElementNS(svgNamespace, "text");
            label.setAttribute("x", point.x + 12);
            label.setAttribute("y", point.y - 10);
            label.setAttribute("class", "label");
            label.textContent = location.address;
            markersElement.appendChild(label);
        });
    }

    window.showLocations = function (newLocations) {
        locations = newLocations;
        render();
    };

    window.showRoute = function (newRoutePoints) {
        routePoints = newRoutePoints;
        render();
    };
</script>
</body>
</html>
